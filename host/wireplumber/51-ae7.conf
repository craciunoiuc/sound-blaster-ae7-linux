# AE-7: PipeWire does not select mixer paths, so Output Select keeps the alsactl value.
monitor.alsa.rules = [
  {
    matches = [
      { device.vendor.id = "0x1102", device.product.id = "0x0010" }
    ]
    actions = {
      update-props = {
        api.alsa.disable-mixer-path = true
      }
    }
  }
]

# blacklist-ca0132.conf — HOST SAFETY NET
#
# Prevents the host kernel from loading the ca0132 codec driver (and as a
# strong measure, the snd_hda_intel controller driver) against the AE-7. This
# keeps the host bootable: the AE-7's AsMedia bridge destabilizes the PCIe bus
# when the HDA driver actively probes it (MSI alloc hangs, codec-query timeouts
# take down the AHCI/RAID root). Only re-enable the drivers when actively
# testing a fix, with the instrumented kernel.
#
# INSTALL:
#   sudo cp host/blacklist-ca0132.conf /etc/modprobe.d/blacklist-ca0132.conf
#   sudo mkinitcpio -P
#   reboot
#
# VERIFY after reboot:
#   lsmod | /usr/bin/grep -E 'ca0132|hda_intel'   # should print nothing

# Prevent auto-loading of the CA0132 codec driver.
blacklist snd_hda_codec_ca0132
# Belt-and-suspenders: explicit load attempt fails closed.
install snd_hda_codec_ca0132 /bin/false

# Also blacklist the HDA controller driver. The controller probe is where the
# MSI-allocation hang and the concurrent-probe lockup occur. If you are testing
# a fixed controller module, comment these out and boot the linux-ae7dbg entry.
blacklist snd_hda_intel
install snd_hda_intel /bin/false
